<!DOCTYPE html>
<html lang="pt-BR">

<head>

    {% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">


<link rel="stylesheet" href="{% static 'appQuali/css/style.css' %}"> 

{% block extra_head %}{% endblock %}

<body>   
   
{% include 'navbar.html' %}

<div class="container mt-3">
    {% if messages %}
          {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
              
          {% if 'success' in message.tags %}
            <script>
                window.addEventListener('DOMContentLoaded', function () {
                    const audio = new Audio("{% static 'sounds/ding-101492.mp3' %}");
                    audio.play().catch(function(e){
                        console.log('Áudio bloqueado:', e);
                    });
                });
            </script>
          {% endif %}
        {% endfor %}
    {% endif %}
</div>

             
    {% block body %}

    {% endblock %}


    {% block footer %}
      <div class="container back div_id"  >
          <h5 class = "navbar-custom">
            <div class="d-grid gap-2">
                <button class="btn btn-secondary" type="button"> <b><span>Marisa & Antonio Prado / versão jan_25</span></b></button>
            </div>
          </h5>
      </div>
    {% endblock footer %}

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>


<!-- Buttons -->
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script> 

<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>

<!-- Dependências do export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script src="{% static 'appQuali/js/custom_quali.js' type='text/javascript' %}"></script> 


</body>
</html>
