{% extends 'base.html' %}
{% load static %}

{% block titulo %}Home{% endblock %}

{% block extra_head %}
<style>

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: -1;
}

.content {
    position: relative;
    z-index: 1;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #fff;
    text-align: center;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.video-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
}

.video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#acesso_navBar{
    display: none;
}

</style>
{% endblock %}

{% block body %}

<div class="video-bg">
    <video autoplay muted loop playsinline>
       <!-- <source src="{% static 'videos/Divulgacao - compacted.mp4' %}" type="video/mp4">-->
        <source src="{% static 'videos/plexus.mp4' %}" type="video/mp4">
    </video>
</div>

<div class="overlay"></div>

<div class="content">
    <h1>Bem-vindo ao Sistema</h1>
    <p>Gestão de Reclamações de Clientes - Senhor Caixa</p>
    <a href="{% url 'appQuali:reclam_cliente' %}" class="btn btn-light">
        Acessar
    </a>
    <hr>
    <h5>Marisa Endruveit & Antonio Prado - v Jan/26</h5>
</div>

{% endblock %}
