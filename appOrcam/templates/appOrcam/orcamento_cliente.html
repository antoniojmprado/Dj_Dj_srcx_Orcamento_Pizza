<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotação | PackMetrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Cotação Rápida de Embalagens</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" action="{% url 'calcular_orcamento' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-bold">Nome ou Empresa</label>
                                <input type="text" class="form-control" id="nome" name="nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefone" class="form-label fw-bold">Telefone / WhatsApp</label>
                                <input type="tel" class="form-control" id="telefone" name="telefone" required>
                            </div>
                            <div class="mb-3">
                                <label for="produto" class="form-label fw-bold">ID do Produto</label>
                                <input type="number" class="form-control" id="produto" name="produto" required placeholder="Ex: 1">
                            </div>
                            <div class="mb-3">
                                <label for="quantidade" class="form-label fw-bold">Quantidade de Caixas</label>
                                <input type="number" class="form-control" id="quantidade" name="quantidade" required min="1" placeholder="Ex: 1000">
                            </div>
                            <div class="mb-4">
                                <label for="cep" class="form-label fw-bold">CEP de Entrega (Grande SP)</label>
                                <input type="text" class="form-control" id="cep" name="cep" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success btn-lg">Calcular Orçamento</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
