<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotação | PackMetrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Cotação Rápida de Embalagens</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" action="{% url 'calcular_orcamento' %}">
                            {% csrf_token %}
<!-- Dados do Cliente e Entrega -->
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="cliente"><b>Empresa / Cliente:</b></label>
        <input type="text" id="cliente" name="cliente" class="form-control" placeholder="Nome da Empresa" required>
    </div>
    
    <!-- Novo Campo: Nome do Contato -->
    <div class="col-md-6 mb-3">
        <label for="contato"><b>Nome do Contato:</b></label>
        <input type="text" id="contato" name="contato" class="form-control" placeholder="Com quem vamos falar?" required>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label for="telefone"><b>Telefone / WhatsApp:</b></label>
        <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(11) 99999-9999" required>
    </div>
    
    <!-- CEP ÚNICO (Gatilho da busca) -->
    <div class="col-md-6 mb-3">
        <label for="cep"><b>CEP de Entrega:</b></label>
        <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
        <small id="cep-status" class="text-muted"></small>
    </div>
</div>

<!-- Endereço Auto-preenchido -->
<div class="row">
    <div class="col-md-5 mb-3">
        <label for="logradouro"><b>Rua / Logradouro:</b></label>
        <input type="text" id="logradouro" name="logradouro" class="form-control" required>
    </div>
    <div class="col-md-2 mb-3">
        <label for="numero"><b>Número:</b></label>
        <input type="text" id="numero" name="numero" class="form-control" required>
    </div>
    <div class="col-md-5 mb-3">
        <label for="complemento"><b>Complemento:</b></label>
        <input type="text" id="complemento" name="complemento" class="form-control" placeholder="Galpão, Sala, etc.">
    </div>
</div>

<div class="row">
    <div class="col-md-5 mb-3">
        <label for="bairro"><b>Bairro:</b></label>
        <input type="text" id="bairro" name="bairro" class="form-control" required>
    </div>
    <div class="col-md-5 mb-3">
        <label for="cidade"><b>Cidade:</b></label>
        <input type="text" id="cidade" name="cidade" class="form-control" required>
    </div>
    <div class="col-md-2 mb-3">
        <label for="uf"><b>UF:</b></label>
        <input type="text" id="uf" name="uf" class="form-control" maxlength="2" required>
    </div>
</div>
                           

                            <div class="mb-4">
                                <label class="form-label"><b>Selecione as Caixas e Quantidades:</b></label>
                                
                                <!-- Caixa delimitada com barra de rolagem interna -->
                                <div class="border rounded p-2" style="max-height: 220px; overflow-y: auto; background-color: #fdfdfd;">
                                    <div class="row m-0">
                                        {% for produto in produtos %}
                                        <div class="col-md-12 mb-2 px-1">
                                            <div class="input-group input-group-sm">
                                                <!-- 1. O Checkbox -->
                                                <div class="input-group-text bg-white">
                                                    <input class="form-check-input mt-0" type="checkbox" name="produtos_selecionados" value="{{ produto.id }}" id="check_{{ produto.id }}">
                                                </div>
                                                
                                                <!-- 2. Nome do Produto (clicável) -->
                                                <input type="text" class="form-control bg-light" value="{{ produto.nome }} - {{ produto.tipo_papelao }}" readonly style="cursor: pointer; font-size: 0.9em;" onclick="document.getElementById('check_{{ produto.id }}').click();">
                                                
                                                <!-- 3. Quantidade (mais estreito) -->
                                                <input type="number" class="form-control" name="quantidade_{{ produto.id }}" placeholder="Qtd (ex: 1000)" min="1" style="max-width: 130px;">
                                            </div>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </div>
                                
                                <small class="text-muted mt-1 d-block">Role a lista para ver todas as opções. Marque a caixa e informe a quantidade ao lado.</small>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success btn-lg">Calcular Orçamento</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, '');
        let statusText = document.getElementById('cep-status');

        if (cep.length === 8) {
            statusText.innerText = "Consultando base local...";
            statusText.style.color = "blue";

            // Dispara a consulta para o SEU servidor, não mais para a internet
            fetch(`/orcam/api/consulta-cep/${cep}/`) 
                .then(response => response.json())
                .then(data => {
                    if (!data.erro) {
                        document.getElementById('logradouro').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('uf').value = data.uf;
                        
                        statusText.innerText = "";
                        document.getElementById('numero').focus();
                    } else {
                        statusText.innerText = "CEP não encontrado na base EDNE.";
                        statusText.style.color = "red";
                    }
                })
                .catch(error => {
                    statusText.innerText = "Erro ao acessar o banco de dados.";
                    statusText.style.color = "red";
                });
        } else {
            statusText.innerText = "CEP inválido.";
            statusText.style.color = "red";
        }
    });
</script>
