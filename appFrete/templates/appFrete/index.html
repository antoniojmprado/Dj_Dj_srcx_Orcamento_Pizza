{% extends 'appFrete/base.html' %}
{% load static %}

{% block title %}Calcular Frete{% endblock %}

{% block body %}
<div class="container mt-4">

    <!-- Cabeçalho padronizado estilo Botão -->
    <button class="btn btn-info w-100 text-left mb-3" type="button" style="cursor: default;">
        <h4 class="margin-bottom: 0;">🚚 Calcular Frete</h4>
    </button>  
    <hr>

    <!-- Exibição de Mensagens/Erros do Servidor -->
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% endfor %}
    {% endif %}

    <form action="{% url 'appFrete:calcular_frete_view' %}" id="form_entrada" method="POST">
        {% csrf_token %}
        
        <div class="row">
            <!-- Campo CEP -->
            <div class="col-12 mb-3">
                <label for="cep_destino" class="form-label">Digite o CEP</label>
                <input class="form-control mask-cep" type="text" name="cep_destino" id="cep_destino" oninput="check_cep(this)" placeholder="digite o CEP" required>
            </div>

            <!-- Campo Cliente -->
            <div class="col-12 mb-3">
                <label for="cliente" class="form-label">Cliente</label>
                <input class="form-control" type="text" name="cliente" id="cliente" oninput="check_cliente(this)" placeholder="nome do cliente" required>
            </div>

            <!-- Campo Valor da Carga -->
            <div class="col-12 mb-3">
                <label for="valor_total" class="form-label">Digite o valor total da carga</label> 
                <input class="form-control mask-decimal" type="text" name="valor_total" id="valor_total" oninput="check(this)" placeholder="valor da carga" required>
            </div>

            <!-- Campo Peso da Carga -->
            <div class="col-12 mb-3">
                <label for="kg_total" class="form-label">Digite o peso total da carga em kg</label>
                <input class="form-control mask-inteiro" type="text" name="kg_total" id="kg_total" oninput="check(this)" placeholder="peso da carga" required>
            </div>
        </div>

        <hr>
        <!-- Botão de ação com a tecla de atalho nativa -->
        <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg btn-block" type="submit" name="btn_submit" id="btn_submit" accesskey="m">
                Avançar [ALT + m]
            </button>
        </div>
        <hr>
    </form>

</div>
{% endblock %}
